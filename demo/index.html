<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#107c41"><title>GridWeb — Workbook studio</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="titlebar"><div class="brand-mark" aria-hidden="true">G</div><strong>GridWeb</strong><span class="title-divider"></span><input id="book-title" aria-label="Workbook title" value="Northstar · Operating plan"><span class="saved" id="saved">Local workbook</span><div class="title-actions"><button id="search-button" title="Find cells (Ctrl+F)">⌕ <span>Find in workbook</span></button><button data-command="help" title="Documentation">?</button><button data-command="theme" title="Toggle light / dark theme">◐</button><span class="avatar" title="Local workspace — no account required">GW</span></div></header>
<nav class="tabs" aria-label="Ribbon tabs" role="tablist"><button class="file-tab" data-command="file">File</button><button role="tab" data-tab="Home" aria-selected="true">Home</button><button role="tab" data-tab="Insert">Insert</button><button role="tab" data-tab="Page Layout">Page Layout</button><button role="tab" data-tab="Formulas">Formulas</button><button role="tab" data-tab="Data">Data</button><button role="tab" data-tab="Review">Review</button><button role="tab" data-tab="View">View</button><span class="version">PREVIEW 0.4.0</span></nav>
<div id="ribbon" class="ribbon" aria-label="Workbook commands"></div><div id="companion-ribbon"></div>
<div class="formula-bar"><input id="address" aria-label="Cell address or range" value="A1"><span class="bar-divider"></span><button id="cancel-formula" title="Cancel formula edit">×</button><button id="commit-formula" title="Apply formula">✓</button><button data-command="functions" class="fx" title="Insert function">ƒx</button><input id="formula" aria-label="Formula bar" autocomplete="off" spellcheck="false"><button data-command="inspector" title="Toggle inspector">☷</button></div>
<main id="workspace"><section id="document-pane" class="document-pane"><grid-web id="grid" aria-label="Workbook spreadsheet"></grid-web></section><aside id="inspector" class="inspector"><header><strong>Workbook insights</strong><button data-command="inspector" aria-label="Close inspector">×</button></header><div class="inspector-tabs"><button data-panel="cell" class="selected">Cell</button><button data-panel="analysis">Analysis</button><button data-panel="ecosystem">Libraries</button></div><div id="panel-content"></div></aside></main>
<div class="sheet-strip"><div class="sheet-navigation"><button id="previous-sheet" aria-label="Previous worksheet">‹</button><button id="next-sheet" aria-label="Next worksheet">›</button></div><div id="sheet-tabs" role="tablist" aria-label="Worksheets"></div><button data-command="addSheet" class="add-sheet" title="Add worksheet">＋</button><span class="local-note">Stored in this browser</span></div>
<footer class="statusbar"><span class="status-dot"></span><span id="status">Ready</span><span id="stats"></span><div class="view-buttons"><button data-view="normal" class="selected" title="Normal view">▦</button><button data-view="pageLayout" title="Page layout">▤</button><button data-view="pageBreak" title="Page break preview">▥</button></div><button id="zoom-out" aria-label="Zoom out">−</button><input id="zoom" type="range" min="50" max="200" step="10" value="100" aria-label="Zoom"><button id="zoom-in" aria-label="Zoom in">＋</button><span id="zoom-value">100%</span></footer>
<input id="open-file" type="file" accept=".json,.csv,.tsv,.xlsx" hidden>
<dialog id="dialog"><form id="dialog-form"><header><h2 id="dialog-title"></h2><button type="button" id="close-dialog" aria-label="Close dialog">×</button></header><div id="dialog-fields"></div><p id="dialog-error" role="alert"></p><footer><button type="button" id="cancel-dialog">Cancel</button><button type="submit" id="submit-dialog" class="primary">Apply</button></footer></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script type="module" src="./app.js"></script>
</body></html>
