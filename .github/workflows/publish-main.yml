name: Publish verified main version
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: publish-verified-main
  cancel-in-progress: false
jobs:
  identity:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create a version tag only for the verified main commit
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$VERIFIED_SHA" ]]
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$CURRENT_MAIN" != "$VERIFIED_SHA" ]]; then
            echo 'A newer main commit exists; its own CI must finish before publication.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="$(node -p "'v'+require('./package.json').version")"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [[ "$TAG_SHA" != "$VERIFIED_SHA" ]]; then
              echo "Version $TAG already belongs to another immutable release commit; increment package.json to release again."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$TAG" -f "sha=$VERIFIED_SHA"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
  publish:
    needs: identity
    if: needs.identity.outputs.publish == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.identity.outputs.tag }}
      expected_sha: ${{ needs.identity.outputs.sha }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
