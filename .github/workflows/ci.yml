name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global typescript@5.8.3
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run check
      - uses: actions/setup-python@v5
        if: matrix.node == 24
        with:
          python-version: '3.12'
      - name: Install browser test tools
        if: matrix.node == 24
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test actual standalone Chromium UI
        if: matrix.node == 24
        shell: bash
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == 24
        with:
          name: browser-verification
          path: test-results/
          if-no-files-found: ignore
  native-build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64
      - run: npm run build
      - name: Compile native controls and samples
        shell: pwsh
        run: |
          dotnet --version
          foreach ($project in @('GridWeb.Client', 'GridWeb.Wpf', 'GridWeb.Avalonia', 'Samples.Wpf', 'Samples.Avalonia')) {
            dotnet build "dotnet/$project/$project.csproj" -c Release -p:Platform=x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # WinUI PRI/XAML tasks require Visual Studio MSBuild, not dotnet MSBuild.
          foreach ($project in @('GridWeb.WinUI', 'Samples.WinUI')) {
            msbuild "dotnet/$project/$project.csproj" /restore /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          dotnet run --project dotnet/GridWeb.Client.Tests/GridWeb.Client.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  runtime:
    uses: ./.github/workflows/runtime.yml
