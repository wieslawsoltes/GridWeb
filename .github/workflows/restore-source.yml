name: Import verified initial source
on:
  push:
    branches: [main]
    paths: ['.bootstrap/ready.json']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify and restore source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '.bootstrap/ready.json').read_text())
          names = manifest['chunks']
          if len(names) > 100 or any(not n.startswith('part-') or '/' in n for n in names):
              raise ValueError('Invalid source chunks')
          packed = base64.b64decode(''.join((root / '.bootstrap' / n).read_text().strip() for n in names), validate=True)
          if hashlib.sha256(packed).hexdigest() != manifest['sha256']:
              raise ValueError('Source checksum mismatch')
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw = decoder.decompress(packed, max_length=8*1024*1024)
          if not decoder.eof or len(raw) >= 8*1024*1024 or decoder.unused_data:
              raise ValueError('Invalid or oversized source archive')
          files = json.loads(raw)
          allowed = {'src','demo','docs','examples','dotnet','scripts','tests','types'}
          allowed_root = {'package.json','README.md','LICENSE','NOTICE.md','CHANGELOG.md','SECURITY.md','.gitignore','.editorconfig'}
          for name, content in files.items():
              path = pathlib.PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts or '\\' in name or not (path.parts[0] in allowed or name in allowed_root):
                  raise ValueError('Unsafe source path: ' + name)
              if not isinstance(content, str):
                  raise ValueError('Source must be UTF-8 text')
              target = root / name
              if target.exists():
                  raise ValueError('Initial import cannot overwrite existing files: ' + name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          print('Verified and restored', len(files), 'UTF-8 source files')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core src/calc src/data src/io src/core.js src/io/index.js
          git commit -m 'feat(core): implement sparse workbook, formula calculation, analysis and file exchange'
          git add src/render src/controls.js src/index.js src/adapters src/host
          git commit -m 'feat(controls): add virtualized editing, printing, MVVM, React, workers and host RPC'
          git add dotnet examples
          git commit -m 'feat(hosts): add typed C# API and WPF, WinUI and Avalonia controls'
          git add demo
          git commit -m 'feat(sample): add workbook studio and seven reusable library integrations'
          git add docs tests types scripts package.json README.md LICENSE NOTICE.md CHANGELOG.md SECURITY.md .gitignore .editorconfig
          git commit -m 'build: add package tooling, regression suites, API types and compatibility documentation'
          git rm -r .bootstrap
          git commit -m 'chore: remove verified initial transfer payload'
          git push origin HEAD:main
      - name: Generate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic dependency resolution
        shell: bash
        run: |
          git add package-lock.json
          git commit -m 'build: lock npm dependencies for reproducible releases'
          git push origin HEAD:main
